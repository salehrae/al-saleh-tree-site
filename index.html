<script>
  // Apply the saved page choice immediately (before first paint) so there's
  // no flash of the wrong page when the page loads. Only two pages exist now:
  // 'modern' (شجرة الصالح — القائمة الكاملة) and 'circular' (أقربائي).
  (function(){
    try{
      var t = localStorage.getItem('altree_theme');
      document.documentElement.setAttribute('data-theme', (t === 'circular') ? 'circular' : 'modern');
    }catch(e){
      document.documentElement.setAttribute('data-theme', 'modern');
    }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#2f8f5e;
    --gold-dark:#1f6b45;
    --gold-light:#eaf6f0;
    --gold-50:#f5faf7;
    --gold-gradient:linear-gradient(135deg, #37a173, var(--gold-dark));
    --maroon:#16241c;
    --male:#3f8f68;
    --female:#c0392b;
    --line:#e3e9e6;
    --ink-soft:#3f5c4c;
    --shadow-sm:0 1px 3px rgba(17,45,32,.10);
    --shadow-md:0 4px 14px rgba(17,45,32,.14);
    --shadow-lg:0 10px 28px rgba(17,45,32,.16);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
  }
  *{box-sizing:border-box;}
  /* ---- shared inline icon sprite (search/expand/collapse/etc. -- see the
     hidden <svg><symbol> sprite near the top of <body>) ---- */
  .btn-ic{
    width:16px; height:16px; flex:0 0 auto;
    stroke:currentColor; stroke-width:2.1; fill:none;
    stroke-linecap:round; stroke-linejoin:round;
  }
  /* On a phone, deeply-nested rows (توسيع الكل can open branches 13
     generations deep) or a long search-result path can end up a bit wider
     than the screen. Without this, that extra width made the WHOLE page
     scrollable sideways — any touch-scroll could drag the screen left/right
     instead of just up/down. Clipping it here keeps the page itself pinned
     to the screen width; the individual overflowing element just gets cut
     off at the edge instead of dragging the whole layout with it. */
  /* only on <html>, not <body> too -- setting overflow-x on both at once
     turns <body> into its own scroll container instead of the normal
     viewport-level scroll. */
  html{ overflow-x:hidden; max-width:100%; }
  /* overflow-x:hidden alone stops the page from being scrolled sideways,
     but on an actual phone there's a second, separate cause of "the screen
     moves a little": the browser's own rubber-band/bounce gesture at the
     edges. overscroll-behavior turns that off. (Originally this only
     disabled it on the X axis, since only sideways movement had been
     reported -- now that the mobile "app shell" layout below keeps the
     whole page from scrolling at all and puts a touch gesture on
     #treeViewport/.circ-scroll-area instead, a vertical bounce there can
     also visibly wiggle the "fixed" header/toolbar above it, so this now
     covers both axes; see those elements' own overscroll-behavior too.) */
  html, body{ overscroll-behavior:none; }
  body{
    margin:0; padding:0;
    font-family:'Cairo','Tahoma',sans-serif;
    background:#eaf5ee;
    color:#1c2e24;
  }
  .wrap{ max-width:1100px; margin:0 auto; padding:20px 16px 60px; }

  .controls{ display:flex; flex-direction:column; gap:8px; margin:0; }
  .controls button{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    font-family:inherit; font-size:.88em; cursor:pointer;
    background:var(--gold-gradient); color:#fff; border:none;
    padding:9px 12px; border-radius:var(--radius-sm); font-weight:600;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  }
  .controls button:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .controls button:active{ transform:translateY(0); box-shadow:var(--shadow-sm); }
  .controls button:disabled{ opacity:.4; cursor:default; }
  .controls button:disabled:hover{ box-shadow:var(--shadow-sm); transform:none; }
  /* matches the other green pill buttons in this toolbar (white bold text) —
     it used to be a plain white/outlined checkbox that stood out from its
     green siblings */
  .hide-female-toggle{
    display:flex; align-items:center; justify-content:center; gap:6px; background:var(--gold-gradient);
    border:none; border-radius:var(--radius-sm); padding:8px 10px; font-size:.85em; font-weight:700;
    color:#fff; cursor:pointer; box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  .hide-female-toggle:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .hide-female-toggle input{ accent-color:#fff; }

  .tree-viewport{
    background:#fbfdfc;
    border:1.5px solid var(--line); border-radius:var(--radius-lg);
    padding:14px 10px; margin-top:10px;
    display:flex; align-items:flex-start; gap:14px;
    box-shadow:var(--shadow-lg);
  }
  .tree-content{ flex:1 1 auto; min-width:0; }

  .search-panel-wrap{ position:relative; }
  /* the شجرة الصالح page's own 5-field search panel is shown/hidden by the
     🔍 بحث toggle button -- scoped to this one id so the أقربائي page's own
     (always-shown) search panel, which shares the .search-panel-wrap class,
     is never affected */
  #listSearchPanelWrap.collapsed{ display:none; }
  #listSearchPanelWrap{ margin-top:10px; }
  .search-panel{
    display:flex; flex-direction:column; align-items:stretch; gap:8px;
  }
  .search-field{ display:flex; flex-direction:column; gap:4px; position:relative; }
  .suggest-box{
    position:absolute; top:100%; right:0; left:0; z-index:30; margin-top:4px;
    background:var(--maroon); border:1.5px solid #000; border-radius:var(--radius-sm);
    max-height:220px; overflow-y:auto; display:none;
    box-shadow:var(--shadow-lg);
  }
  .suggest-box.open{ display:block; }
  .suggest-box div{ padding:10px 12px; font-size:.9em; font-weight:700; color:#fff; cursor:pointer; border-bottom:1px solid #2a3a30; }
  .suggest-box div:last-child{ border-bottom:none; }
  .suggest-box div:hover{ background:#2f4335; }
  .suggest-box div.empty{ color:#9aa89f; cursor:default; }
  .suggest-box div.empty:hover{ background:var(--maroon); }
  .search-field label{ font-size:.78em; color:var(--ink-soft); font-weight:700; padding:0 3px; }
  .search-field input{
    font-family:inherit; font-size:.9em; padding:8px 12px; border-radius:var(--radius-sm);
    border:1.5px solid var(--line); width:100%; direction:rtl; background:#fff; color:#1c2e24;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .search-field input::placeholder{ color:#9dbfa9; }
  .search-field input:focus{ outline:none; border-color:var(--male); box-shadow:0 0 0 3px rgba(63,143,104,.15); }
  #searchResults, #relResults{
    margin-top:8px; background:#fff;
    border:1.5px solid var(--gold); border-radius:var(--radius-sm); max-height:280px;
    overflow-y:auto; display:none; box-shadow:var(--shadow-lg);
  }
  #searchResults div, #relResults div{ padding:8px 10px; cursor:pointer; border-bottom:1px solid #eee; font-size:.85em; }
  #searchResults div:hover, #relResults div:hover{ background:#e6f4ea; }
  #searchResults .path, #relResults .path{ color:#888; font-size:.75em; }
  #searchResults div.error, #relResults div.error{ cursor:default; color:#c0392b; font-weight:700; }
  #searchResults div.error:hover, #relResults div.error:hover{ background:#fff; }

  /* the full mobile "app shell" layout (header/pills/toolbar/hint fixed,
     only the tree or chart scrolling) lives in one place near the very
     end of this stylesheet, after the circular-theme rules it also
     touches -- see the "mobile app shell" block further down. */

  .node{ }
  .row{
    display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:6px;
    min-height:30px;
  }
  .row.has-children{ cursor:pointer; }
  .row:hover{ background:#eef7f0; }
  .toggle{
    width:16px; height:16px; flex:0 0 auto; text-align:center; color:var(--gold-dark);
    font-size:.75em; user-select:none; transition:transform .15s; line-height:16px;
  }
  .toggle.open{ transform:rotate(90deg); }
  .spacer{ width:16px; flex:0 0 auto; }
  .branch-bar{ width:4px; align-self:stretch; border-radius:3px; flex:0 0 auto; min-height:18px; }
  .name{ font-weight:600; font-size:.96em; }
  .name.female{ color:var(--female); }
  .name.male{ color:#1c2e24; }
  .count{ font-size:.76em; color:#6b8a76; }
  .children{
    border-inline-start:1.5px dashed #d8e6dc; margin-inline-start:12px; padding-inline-start:10px;
  }
  .children.collapsed{ display:none; }
  body.hide-female .node.gender-female{ display:none; }

  .highlight-flash{ animation: flash 1.8s ease; }
  @keyframes flash{ 0%{ background:#fff3b0; } 100%{ background:transparent; } }
  /* persistent yellow shadow over the exact member found by the شجرة الصالح
     5-field search -- unlike .highlight-flash (a brief arrival pop that
     fades), this stays until the next search is opened */
  .search-match{
    box-shadow:0 0 0 3px #ffd43b, 0 0 14px 4px rgba(255,212,59,.65);
    border-radius:10px;
  }

  .load-note{ text-align:center; padding:60px 20px; color:#3f5c4c; font-size:1em; line-height:1.8; }

  @media (max-width: 640px){
    .search-field input{ width:110px; }
  }

  /* ================= branded header ================= */
  .site-header{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin:2px 0 14px; padding:2px 0;
  }
  .site-logo{ width:38px; height:38px; display:block; }
  .site-title{
    margin:0; font-size:1.22em; font-weight:800; color:var(--maroon);
    letter-spacing:.2px;
  }

  /* ================= design switcher ================= */
  .theme-switcher{
    display:flex; align-items:center; justify-content:center; gap:8px;
    margin:0 0 14px; font-size:.82em; color:var(--ink-soft); flex-wrap:wrap;
  }
  .theme-switcher .theme-btn{
    display:inline-flex; align-items:center; gap:6px;
    font-family:inherit; font-size:.95em; cursor:pointer;
    background:#fff; color:var(--ink-soft); border:1.5px solid var(--line);
    padding:7px 16px; border-radius:999px; font-weight:700;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease, color .15s ease;
  }
  .theme-switcher .theme-btn:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  html[data-theme="modern"] .theme-btn[data-theme-choice="modern"],
  html[data-theme="circular"] .theme-btn[data-theme-choice="circular"]{
    background:var(--gold-gradient); color:#fff; border-color:transparent;
  }

  /* ================= modern theme (mobile-friendly) ================= */
  html[data-theme="modern"] body{ background:#f3f6f4; }
  html[data-theme="modern"] .tree-viewport{
    background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
  }
  html[data-theme="modern"] .controls{ flex-direction:row; flex-wrap:wrap; }
  html[data-theme="modern"] .controls button{ flex:1 1 auto; min-height:42px; }
  html[data-theme="modern"] .hide-female-toggle{ flex:1 1 100%; min-height:42px; }

  html[data-theme="modern"] .row{ min-height:48px; padding:6px 10px; border-radius:var(--radius-md); gap:10px; transition:background .12s ease; }
  html[data-theme="modern"] .row:hover{ background:var(--gold-light); }
  html[data-theme="modern"] .toggle{ width:22px; height:22px; font-size:1em; line-height:22px; }
  html[data-theme="modern"] .spacer{ width:22px; }
  html[data-theme="modern"] .branch-bar{
    width:30px; height:30px; min-width:30px; border-radius:50%; align-self:center;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:.82em;
    background:var(--branch-solid, #1f6b45) !important;
    text-shadow:0 1px 2px rgba(0,0,0,.45);
    box-shadow:var(--shadow-sm);
  }
  html[data-theme="modern"] .branch-bar::before{ content: attr(data-initial); }
  html[data-theme="modern"] .name{ font-size:1.03em; }
  html[data-theme="modern"] .count{
    background:var(--gold-light); color:var(--ink-soft); padding:2px 9px; border-radius:999px; font-size:.72em;
  }
  html[data-theme="modern"] .children{
    border-inline-start:1.5px solid var(--line); margin-inline-start:15px; padding-inline-start:15px;
  }

  /* ================= list hint banner (شجرة الصالح page) ================= */
  .list-hint{
    background:var(--gold-light); border:1.5px solid var(--gold); border-radius:var(--radius-sm);
    padding:9px 12px; font-size:.85em; color:var(--gold-dark); font-weight:700; margin:0 0 10px;
  }

  /* ================= circular theme (radial / sunburst chart) ================= */
  .circular-view{ display:none; flex:1 1 auto; min-width:0; text-align:center; }
  html[data-theme="circular"] #treeContent{ display:none; }
  html[data-theme="circular"] .circular-view{ display:block; }
  html[data-theme="circular"] .tree-viewport{
    background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-lg);
    box-shadow:var(--shadow-lg);
  }
  .relatives-search-panel{ max-width:420px; margin:14px auto 0; text-align:right; }
  .relatives-search-panel .rel-intro{ color:var(--ink-soft); font-size:.9em; margin:0 0 12px; text-align:center; }
  #relSearchBtn{
    display:flex; align-items:center; justify-content:center; gap:8px; font-family:inherit; font-weight:800;
    font-size:.92em; cursor:pointer; background:var(--gold-gradient); color:#fff; border:none;
    padding:10px 14px; border-radius:var(--radius-md); box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, transform .15s ease;
  }
  #relSearchBtn:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .circular-chart-panel{ display:none; }
  .circular-toolbar{
    display:flex; align-items:center; justify-content:center; gap:10px;
    flex-wrap:wrap; padding:10px 6px 0;
  }
  .circular-toolbar button{
    display:inline-flex; align-items:center; gap:6px;
    font-family:inherit; font-size:.85em; cursor:pointer;
    background:var(--gold-gradient); color:#fff; border:none;
    padding:8px 16px; border-radius:999px; font-weight:700;
    box-shadow:var(--shadow-sm);
    transition:box-shadow .15s ease, transform .15s ease, opacity .15s ease;
  }
  .circular-toolbar button:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .circular-toolbar button:disabled{ opacity:.4; cursor:default; }
  .circular-toolbar button:disabled:hover{ box-shadow:var(--shadow-sm); transform:none; }
  /* match the إخفاء الإناث toggle to the rest of this toolbar's pill buttons */
  .circular-toolbar .hide-female-toggle{
    background:var(--gold-gradient); color:#fff; border:none;
    padding:8px 16px; border-radius:999px; font-weight:700; font-size:.85em;
    box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, transform .15s ease;
  }
  .circular-toolbar .hide-female-toggle:hover{ box-shadow:var(--shadow-md); transform:translateY(-1px); }
  .circular-toolbar .hide-female-toggle input{ accent-color:#fff; }
  .circ-zoom-wrap{
    width:100%; max-width:560px; margin:10px auto 0; overflow:hidden;
    border-radius:12px; touch-action:none; cursor:grab;
  }
  .circ-zoom-wrap.dragging{ cursor:grabbing; }
  #circSvg{ width:100%; height:auto; display:block; touch-action:none; transform-origin:0 0; }
  .circ-zoom-hint{ color:#7a8d82; font-size:.78em; margin:8px 0 0; }
  .circ-arc{ cursor:pointer; stroke:#fff; stroke-width:.4; }
  .circ-arc.male{ fill:#bcd9ef; }
  .circ-arc.female{ fill:#f6c9d3; }
  /* the exact person searched for on the أقربائي form, highlighted on the
     grandfather-centered tree that opens so they're easy to spot among
     their siblings/cousins */
  .circ-arc.highlight{ fill:#ffd43b; }
  .circ-arc:hover{ filter:brightness(0.95); }
  .circ-label{ font-family:'Tajawal','Cairo','Tahoma',sans-serif; font-weight:700; font-size:3px; fill:#1c2e24; pointer-events:none; }
  /* daughters sharing one father share a single undivided wedge (see
     addDaughterGroup) with their names stacked inside it. Since there's no
     longer one wedge per daughter to click, each stacked name becomes its
     own click target instead — "press any name to open her own tree" still
     holds, it's just the label itself that's pressable here. */
  .circ-label.group-label{ pointer-events:auto; cursor:pointer; }
  .circ-label.group-label:hover{ text-decoration:underline; }
  .circ-center{ cursor:default; }
  .circ-center-circle{ fill:var(--male); stroke:#fff; stroke-width:3; }
  .circ-center-name{ font-family:'Cairo','Tahoma',sans-serif; font-weight:800; fill:#fff; font-size:17px; }
  .circ-center-gen{ font-family:'Cairo','Tahoma',sans-serif; fill:#d9ecdf; font-size:11px; }
  .circ-caption{ color:#3f5c4c; font-size:.88em; margin:10px 0 16px; font-weight:600; }

  /* ================= "Arabic names only" warning toast ================= */
  /* Pinned near the TOP of the screen, not the bottom — on a phone, typing
     into any of these fields brings up the on-screen keyboard, which covers
     roughly the bottom half of the viewport and was hiding a bottom-pinned
     toast completely. The top is always clear of the keyboard. */
  .arabic-toast{
    position:fixed; top:16px; bottom:auto; left:50%; transform:translateX(-50%) translateY(-16px);
    background:var(--maroon); color:#fff; font-weight:700; font-size:.92em;
    padding:12px 22px; border-radius:999px; box-shadow:0 8px 22px rgba(0,0,0,.35);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:999; max-width:90vw; text-align:center;
  }
  .arabic-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ================= mobile "app shell" layout =================
     On a phone, everything above the actual tree content -- the
     logo/title, the شجرة الصالح/أقربائي switcher pills, the toolbar
     buttons (plus the بحث panel when it's open), and the hint banner --
     stays fixed in place and never scrolls away. Exactly one region
     below all of that becomes its own independently scrollable pane
     that fills whatever height is left: the tree rows themselves
     (#treeViewport) on the شجرة الصالح page, or the circular chart plus
     its own zoom-hint/caption (.circ-scroll-area) on the أقربائي page --
     where the chart's existing custom pinch/pan/zoom keeps working
     exactly as before, just inside a shorter pane.

     This replaces the old position:fixed + JS-measured-margin approach
     (one fixed toolbar, with .wrap pushed down by its height). A plain
     flex column does the same job with no JS at all: every "chrome"
     piece below is flex:0 0 auto (sized to its own content, never grows
     or shrinks), and the one scrollable pane per page is flex:1 1 auto
     with its own overflow-y, so the browser's layout engine keeps
     everything in place with no resize-listener/measurement code. */
  @media (max-width: 768px){
    html, body{ height:100%; overflow:hidden; }
    .wrap{
      /* 100dvh (falls back to 100vh in older browsers, which simply don't
         recognize the dvh unit and keep the line above) tracks the
         ACTUAL visible height as a phone's browser chrome (address bar)
         animates in/out during a touch scroll. Plain 100vh is a static
         number (usually sized for the chrome-hidden state) that doesn't
         track that animation, so the "fixed" header/toolbar above the
         scrollable tree could visibly jump/wiggle as the chrome moved --
         reported as the whole top area wiggling up/down (and, since a
         resize also nudges flex layout horizontally by a sub-pixel or two
         on some phones, left/right as well). */
      height:100vh; height:100dvh; max-height:100vh; max-height:100dvh;
      overflow:hidden; display:flex; flex-direction:column; padding:10px 12px 0;
    }
    .site-header, .theme-switcher{ flex:0 0 auto; }
    /* Each generation indents its .children by 30px (15+15) on the
       desktop-sized modern theme -- fine with hundreds of pixels to spare,
       but توسيع الكل can run a branch 13 generations deep, and at 30px/
       level that alone eats 300px-plus of a phone's ~340px-wide tree pane,
       squeezing a deep row's own avatar+name into a sliver too narrow to
       read (reported: a بحث search match that deep rendered with its name
       cut off and no way to see it). Shrinking the per-level indent on
       mobile only keeps nesting visible without starving deep rows of the
       room their own content actually needs. */
    html[data-theme="modern"] .children{ margin-inline-start:7px; padding-inline-start:7px; }
    /* .tree-viewport's base rule sets align-items:flex-start for its
       DESKTOP row layout (so the two unequal-height panels don't stretch
       to match each other) -- on mobile it's a column instead, where
       align-items controls WIDTH, not height, and flex-start there means
       "don't stretch, size to content": a deeply-expanded row wider than
       the screen would then grow #treeContent/.circular-view (and
       everything stacked inside them, including the "fixed" toolbar)
       past the viewport instead of being contained and clipped by their
       own inner overflow-x:hidden panes. Restoring the normal stretch
       behavior here keeps width properly constrained; it has no effect
       on the desktop row layout, which isn't in this media query. */
    .tree-viewport{
      flex-direction:column; align-items:stretch;
      flex:1 1 auto; min-height:0; min-width:0; overflow:hidden;
    }

    /* شجرة الصالح (list) page: toolbar + بحث panel + hint banner stay
       put; only the tree rows (#treeViewport) scroll */
    .tree-content{ display:flex; flex-direction:column; height:100%; min-height:0; min-width:0; }
    .controls, #listSearchPanelWrap, .tree-content > .list-hint{ flex:0 0 auto; }
    /* min-width:0 alongside overflow-y:auto is what keeps THIS PANE itself
       from growing wider than the screen when a deeply-expanded row
       (توسيع الكل can run 13 generations deep) is a bit wider than
       available -- without it, a flex item's default min-width:auto would
       let that wide row grow #treeViewport (and everything stacked above
       it, including the "fixed" toolbar) past the viewport, re-introducing
       exactly the sideways-drag bug html{overflow-x:hidden} already fixed
       for the page as a whole (see that rule's own comment, above).

       overflow-x is deliberately auto, not hidden, here: at very deep
       generations (this is where a بحث reveal/رجوع jumps to) the per-level
       indentation can eat almost all the available width, leaving too
       little room for even the row's own avatar + name -- auto lets a
       phone swipe sideways within this one pane (never the whole page) to
       reach the rest of a row like that, instead of it being impossible
       to read at all.

       overscroll-behavior:none stops a touch-scroll that reaches the top
       or bottom of THIS pane from "chaining" into a rubber-band bounce of
       whatever's behind/above it -- without it, the "fixed" header/
       toolbar could visibly wiggle when a phone's scroll gesture
       overshoots the end of the tree. */
    #treeViewport{
      flex:1 1 auto; min-height:0; min-width:0; overflow-y:auto; overflow-x:auto;
      -webkit-overflow-scrolling:touch; overscroll-behavior:none; padding-bottom:24px;
    }

    /* أقربائي (circular) page: hint banner + its own toolbar stay put;
       only the chart + its zoom hint/caption (.circ-scroll-area) scroll */
    html[data-theme="circular"] .circular-view{
      display:flex; flex-direction:column; height:100%; min-height:0; min-width:0;
    }
    .relatives-search-panel{
      flex:1 1 auto; min-height:0; min-width:0; overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch; overscroll-behavior:none;
    }
    .circular-chart-panel{ display:flex; flex-direction:column; height:100%; min-height:0; min-width:0; }
    .circular-chart-panel > .list-hint, .circular-toolbar{ flex:0 0 auto; }
    /* same overscroll-behavior:none reasoning as #treeViewport, above */
    .circ-scroll-area{
      flex:1 1 auto; min-height:0; min-width:0; overflow-y:auto; overflow-x:hidden;
      -webkit-overflow-scrolling:touch; overscroll-behavior:none; padding-bottom:24px;
    }
  }
</style>
</head>

<script>
  // Same 5-branch palette as before, so colors stay consistent.
  const BRANCH_COLORS = {
    'ابراهيم': '#8fb3d9', 'إبراهيم': '#8fb3d9',
    'صالح': '#8fc7a4',
    'عبدالله': '#bda6d9',
    'محمد': '#e8bd8a',
    'عثمان': '#dd9aa6'
  };
  const BRANCH_FALLBACK = '#c7bda3';

  function hexToRgb(hex){
    const h = hex.replace('#','');
    return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)];
  }
  function lighten(hex, amount){
    const [r,g,b] = hexToRgb(hex);
    const t = Math.min(amount, 0.75);
    const mix = c => Math.round(c + (255 - c) * t);
    return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
  }

  // ---- design switcher: works immediately, independent of tree data ----
  document.querySelectorAll('.theme-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const choice = btn.getAttribute('data-theme-choice');
      document.documentElement.setAttribute('data-theme', choice);
      try{ localStorage.setItem('altree_theme', choice); }catch(e){}
      // pressing أقربائي always opens a fresh 5-name entry form, never
      // resumes whatever circular tree happened to be open before
      if(choice === 'circular'){
        resetRelativesForm();
        showRelativesSearchForm();
      }
    });
  });
  // (On a phone the header/pills/toolbar/hint staying in place while only
  // the tree or chart scrolls is handled entirely by the mobile "app
  // shell" CSS now -- see the block right before </style> -- no JS
  // measurement/resize-listener code is needed for it any more.)

  let data; // set once data/tree.json loads

  // ================= circular (sunburst) view =================
  let circCenterNode = null;
  // every centering (except a fresh search result) pushes the node being
  // left onto this stack, so "رجوع" can retrace the exact path taken,
  // however it was taken — not just "go to the parent"
  let circHistory = [];
  // the exact person found by the أقربائي 5-name search, highlighted in
  // yellow wherever they appear as a wedge — set on a fresh search result,
  // left alone otherwise so the highlight survives drilling in/out/رجوع
  let circHighlightNode = null;
  let circMaxDepth = 4;
  const CIRC_MAX_RINGS = 9;
  const CIRC_MAX_OUTER = 308; // outer edge radius the rings must fit inside, in viewBox units
  const CIRC_LABEL_FONT_SIZE = 2.5; // kept in sync with the .circ-label font-size in <style>
  let hideFemales = false;
  // شجرة الصالح (list) page's own رجوع — mirrors the أقربائي page's history
  // stack, but undoes a search-result "reveal" (which force-opens whatever
  // collapsed ancestors stand between the root and the found person, then
  // scrolls to them) instead of a wedge click. Each entry remembers only the
  // ancestors that reveal actually had to open (so رجوع re-collapses exactly
  // those, leaving anything the user had already opened by hand alone) plus
  // the scroll position from right before the jump.
  let listHistory = [];
  // the row currently wearing the persistent yellow search-match shadow (see
  // .search-match), so it can be cleared when a new بحث search starts or
  // when رجوع undoes the reveal that set it
  let searchMatchRow = null;
  // The chart measures label widths with getBBox() to decide how much of
  // each name fits in its wedge, but a web font's glyphs are noticeably
  // different from the Tahoma fallback the browser uses while it's still
  // loading — measuring too early makes labels overflow once it swaps in.
  // Every render waits for both fonts actually used in the chart: Tajawal
  // (the small radiating names — picked specifically for being narrower
  // than Cairo, so more names fit without crowding — rendered bold, so the
  // preload below matches that weight) and Cairo (the big center label).
  // Free after the first time, since the browser caches it.
  function whenFontsReady(cb){
    if(window.document && document.fonts && document.fonts.load){
      Promise.all([
        document.fonts.load('400 13px Cairo').catch(() => {}),
        document.fonts.load('800 17px Cairo').catch(() => {}),
        document.fonts.load('700 2.5px Tajawal').catch(() => {})
      ]).then(() => document.fonts.ready).then(cb, cb);
    } else {
      cb();
    }
  }
  const circSvgEl = document.getElementById('circSvg');
  const circCaptionEl = document.getElementById('circCaption');
  const circBackBtn = document.getElementById('circBackBtn');

  // ---- pinch / wheel zoom + drag pan for the circular chart only ----
  const circZoomWrapEl = document.getElementById('circZoomWrap');
  const circZoomResetBtn = document.getElementById('circZoomResetBtn');
  let circZoomScale = 1, circZoomX = 0, circZoomY = 0;
  const CIRC_ZOOM_MIN = 1, CIRC_ZOOM_MAX = 6;

  function applyCircZoomTransform(){
    circSvgEl.style.transform = `translate(${circZoomX}px, ${circZoomY}px) scale(${circZoomScale})`;
  }
  function clampCircPan(){
    const rect = circZoomWrapEl.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const contentW = w * circZoomScale, contentH = h * circZoomScale;
    circZoomX = Math.min(0, Math.max(w - contentW, circZoomX));
    circZoomY = Math.min(0, Math.max(h - contentH, circZoomY));
  }
  function circZoomAt(px, py, factor){
    const newScale = Math.min(CIRC_ZOOM_MAX, Math.max(CIRC_ZOOM_MIN, circZoomScale * factor));
    if(newScale === circZoomScale) return;
    circZoomX = px - (px - circZoomX) * (newScale / circZoomScale);
    circZoomY = py - (py - circZoomY) * (newScale / circZoomScale);
    circZoomScale = newScale;
    clampCircPan();
    applyCircZoomTransform();
  }
  function resetCircZoom(){
    circZoomScale = 1; circZoomX = 0; circZoomY = 0;
    applyCircZoomTransform();
  }

  // mouse wheel (desktop): zoom in/out centered on the cursor
  circZoomWrapEl.addEventListener('wheel', (e) => {
    e.preventDefault();
    const rect = circZoomWrapEl.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    circZoomAt(px, py, e.deltaY < 0 ? 1.15 : 1 / 1.15);
  }, { passive: false });

  // one finger/mouse = pan (once zoomed in); two fingers = pinch to zoom.
  // Uses Pointer Events so the same code handles mouse and touch.
  const circPointers = new Map();
  let circPinchStartDist = 0;
  let circLastPanPoint = null;
  let circDragMoved = false;
  let circSuppressClick = false;

  function circPointerDistance(){
    const pts = Array.from(circPointers.values());
    return Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
  }
  function circPointerMidpoint(){
    const pts = Array.from(circPointers.values());
    return { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
  }
  // Pointer capture is only grabbed once a gesture is confirmed as a real
  // drag/pinch (via setPointerCapture below), never on plain pointerdown.
  // Capturing immediately would make Chromium retarget the matching pointerup
  // (and the click synthesized from it) at this wrapper instead of the wedge
  // actually under the finger/cursor, so a plain tap would stop drilling in.
  circZoomWrapEl.addEventListener('pointerdown', (e) => {
    circPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    circDragMoved = false;
    if(circPointers.size === 2){
      try{
        for(const id of circPointers.keys()) circZoomWrapEl.setPointerCapture(id);
      }catch(err){}
      circPinchStartDist = circPointerDistance();
    } else if(circPointers.size === 1){
      circLastPanPoint = { x: e.clientX, y: e.clientY };
    }
  });
  circZoomWrapEl.addEventListener('pointermove', (e) => {
    if(!circPointers.has(e.pointerId)) return;
    circPointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if(circPointers.size === 2){
      const dist = circPointerDistance();
      const mid = circPointerMidpoint();
      const rect = circZoomWrapEl.getBoundingClientRect();
      if(circPinchStartDist > 0){
        circZoomAt(mid.x - rect.left, mid.y - rect.top, dist / circPinchStartDist);
      }
      circPinchStartDist = dist;
      circDragMoved = true;
    } else if(circPointers.size === 1 && circZoomScale > 1 && circLastPanPoint){
      const dx = e.clientX - circLastPanPoint.x;
      const dy = e.clientY - circLastPanPoint.y;
      if(Math.abs(dx) > 2 || Math.abs(dy) > 2){
        if(!circDragMoved){
          try{ circZoomWrapEl.setPointerCapture(e.pointerId); }catch(err){}
        }
        circDragMoved = true;
        circZoomWrapEl.classList.add('dragging');
      }
      circZoomX += dx;
      circZoomY += dy;
      clampCircPan();
      applyCircZoomTransform();
      circLastPanPoint = { x: e.clientX, y: e.clientY };
    }
  });
  function circPointerEnd(e){
    circPointers.delete(e.pointerId);
    circLastPanPoint = null;
    circPinchStartDist = 0;
    circZoomWrapEl.classList.remove('dragging');
    try{ circZoomWrapEl.releasePointerCapture(e.pointerId); }catch(err){}
    if(circDragMoved){
      // a pan/pinch just ended — swallow the click it would otherwise fire,
      // so lifting a finger off a wedge doesn't also drill into it
      circSuppressClick = true;
      setTimeout(() => { circSuppressClick = false; }, 50);
    }
    circDragMoved = false;
  }
  circZoomWrapEl.addEventListener('pointerup', circPointerEnd);
  circZoomWrapEl.addEventListener('pointercancel', circPointerEnd);
  circZoomWrapEl.addEventListener('click', (e) => {
    if(circSuppressClick){ e.stopPropagation(); e.preventDefault(); }
  }, true);
  circZoomResetBtn.addEventListener('click', resetCircZoom);

  // ---- أقربائي page: toggle between the 5-name entry form and the circular
  // chart. These only touch static DOM (no tree data needed), so they're
  // safe to call immediately, even before data/tree.json has loaded.
  const relativesSearchPanelEl = document.getElementById('relativesSearchPanel');
  const circularChartPanelEl = document.getElementById('circularChartPanel');
  function showRelativesSearchForm(){
    relativesSearchPanelEl.style.display = 'block';
    circularChartPanelEl.style.display = 'none';
  }
  function showRelativesChart(){
    relativesSearchPanelEl.style.display = 'none';
    circularChartPanelEl.style.display = 'block';
  }
  function resetRelativesForm(){
    ['relName','relFather','relGrandfather','relGGFather','relBranch'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.value = '';
    });
    const relResultsBox = document.getElementById('relResults');
    if(relResultsBox){ relResultsBox.innerHTML = ''; relResultsBox.style.display = 'none'; }
    circHighlightNode = null;
  }

  // ---- "names must be Arabic" enforcement, on every name field across both
  // pages. Any Latin letter typed is stripped right back out and a toast
  // pops up to explain why, instead of silently accepting it (the search
  // logic already ignores non-Arabic characters, but leaving them visible
  // in the box would just be confusing). DOM-only, so this is wired up
  // immediately — no need to wait for the tree data to load.
  const LATIN_LETTERS = /[A-Za-z]/;
  const arabicToastEl = document.getElementById('arabicOnlyToast');
  let arabicToastTimer = null;
  function showArabicOnlyToast(){
    if(!arabicToastEl) return;
    arabicToastEl.classList.add('show');
    clearTimeout(arabicToastTimer);
    arabicToastTimer = setTimeout(() => arabicToastEl.classList.remove('show'), 2500);
  }
  function enforceArabicOnly(inputEl){
    if(!inputEl) return;
    inputEl.addEventListener('input', () => {
      if(LATIN_LETTERS.test(inputEl.value)){
        const pos = inputEl.selectionStart;
        const before = inputEl.value;
        inputEl.value = inputEl.value.replace(/[A-Za-z]/g, '');
        // keep the caret roughly where typing left off, now that some
        // characters were removed out from under it
        const removedBeforeCaret = before.slice(0, pos).replace(/[^A-Za-z]/g, '').length;
        const newPos = Math.max(0, pos - removedBeforeCaret);
        try{ inputEl.setSelectionRange(newPos, newPos); }catch(e){}
        showArabicOnlyToast();
      }
    });
  }
  [
    'searchName','searchFather','searchGrandfather','searchGGFather','searchBranch',
    'relName','relFather','relGrandfather','relGGFather','relBranch'
  ].forEach(id => enforceArabicOnly(document.getElementById(id)));

  function polarPoint(cx, cy, r, angle){
    return { x: cx + r * Math.sin(angle), y: cy - r * Math.cos(angle) };
  }
  function arcPath(cx, cy, r0, r1, a0, a1){
    const p0 = polarPoint(cx, cy, r0, a0);
    const p1 = polarPoint(cx, cy, r1, a0);
    const p2 = polarPoint(cx, cy, r1, a1);
    const p3 = polarPoint(cx, cy, r0, a1);
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    return `M ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} ` +
           `L ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} ` +
           `A ${r1.toFixed(2)} ${r1.toFixed(2)} 0 ${large} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)} ` +
           `L ${p3.x.toFixed(2)} ${p3.y.toFixed(2)} ` +
           `A ${r0.toFixed(2)} ${r0.toFixed(2)} 0 ${large} 0 ${p0.x.toFixed(2)} ${p0.y.toFixed(2)} Z`;
  }
  function updateCircBackBtn(){
    circBackBtn.disabled = circHistory.length === 0;
  }
  // resetHistory=true marks a fresh starting point (a brand-new relatives
  // search result) — رجوع has nothing to retrace past that point. Any other
  // centering (clicking a wedge) pushes the node being left so رجوع can
  // step back through it, in whatever order it was actually visited.
  function centerCircularOn(node, resetHistory){
    if(resetHistory){
      circHistory = [];
    } else if(circCenterNode){
      circHistory.push(circCenterNode);
    }
    circCenterNode = node;
    resetCircZoom();
    renderCircular();
    updateCircBackBtn();
  }
  function circGoBack(){
    if(!circHistory.length) return;
    circCenterNode = circHistory.pop();
    resetCircZoom();
    renderCircular();
    updateCircBackBtn();
  }
  function renderCircular(){
    whenFontsReady(renderCircularNow);
  }
  function renderCircularNow(){
    if(!circCenterNode) circCenterNode = data;
    const node = circCenterNode;
    const cx = 320, cy = 320;
    const centerR = 56;
    const depth = Math.max(1, Math.min(circMaxDepth, CIRC_MAX_RINGS));
    // shrink ring thickness as more generations are requested, so any depth
    // up to CIRC_MAX_RINGS always fits inside the fixed-size chart. The cap
    // (60) is just a sanity ceiling for when few rings are shown — at the
    // fixed depth=4 this always renders at, the real limit is the second
    // term, which now uses the canvas's full available radius instead of
    // leaving ~60 viewBox units of unused margin outside the last ring like
    // before, so every ring is noticeably thicker and names have more room
    // before truncating — same font size, same on-screen chart size, just
    // reclaiming space that was going unused.
    const ringThickness = Math.min(60, (CIRC_MAX_OUTER - centerR) / depth);
    const svgNS = 'http://www.w3.org/2000/svg';
    circSvgEl.innerHTML = '';
    const defsEl = document.createElementNS(svgNS, 'defs');
    circSvgEl.appendChild(defsEl);
    let clipCounter = 0;

    // Angular share of a child is based on sqrt(family size) rather than the
    // raw family size. Daughters never carry children forward in this data
    // (every woman is a leaf, _total===1), so next to a brother with a large
    // recorded family she'd be allocated a sliver too thin to ever label.
    // Compressing with sqrt still shows who has the bigger family, but stops
    // leaves from being crushed to invisibility by one prolific sibling.
    // (Equal-for-everyone was tried instead and made it worse: giving a
    // small family the same share as a huge one starves the huge one's own
    // many descendants of room a few rings out, wiping out whole outer
    // rings of labels — reverted.)
    function spanWeight(n){
      return Math.sqrt(n._total);
    }

    // Daughters sharing one father no longer get their own angular slice
    // each (see addDaughterGroup below) — the whole cluster gets ONE
    // combined weight here, same sqrt-compression philosophy as a single
    // child's weight, just applied to the group's size instead of one
    // person's family size.
    function groupWeight(count){
      return spanWeight({ _total: count });
    }

    function visibleChildren(n){
      return hideFemales ? n._children.filter(c => c.gender !== 'female') : n._children;
    }

    let maleCount = 0, femaleCount = 0, deepestRendered = 0;

    function makeClip(r0, r1, a0, a1){
      const clipId = 'circClip' + (clipCounter++);
      const clipPath = document.createElementNS(svgNS, 'clipPath');
      clipPath.setAttribute('id', clipId);
      const clipShape = document.createElementNS(svgNS, 'path');
      clipShape.setAttribute('d', arcPath(cx, cy, r0, r1, a0, a1));
      clipPath.appendChild(clipShape);
      defsEl.appendChild(clipPath);
      return clipId;
    }

    // Every name renders as a single, whole, properly-shaped word — never
    // split into letters, so Arabic joining always stays intact. The text
    // is rotated to read along the radius (vertically, outward from the
    // center). Two different constraints apply on its two axes: along the
    // radius, the limit is the RING'S OWN THICKNESS (r1-r0) — too long a
    // name there gets truncated with "…", which looks fine. Across the
    // radius (the wedge's actual angular width at this point, converted to
    // a real distance), the limit is the font's own height — there's no
    // good way to "truncate" that axis, so rather than show a sliver of a
    // clipped, half-cut letter (which reads as visual noise), a wedge too
    // thin for even one full character gets no label at all. A clip-path
    // on the wedge itself is kept as a hard backstop either way.
    function renderRadialLabel(n, r0, r1, a0, a1, midA, labelR){
      const band = r1 - r0;
      const p = polarPoint(cx, cy, labelR, midA);
      let rotDeg = (midA * 180 / Math.PI) - 90;
      if(midA > Math.PI){ rotDeg += 180; }
      const text = document.createElementNS(svgNS, 'text');
      text.setAttribute('class', 'circ-label');
      text.setAttribute('x', p.x.toFixed(2));
      text.setAttribute('y', p.y.toFixed(2));
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('dominant-baseline', 'middle');
      text.setAttribute('transform', `rotate(${rotDeg.toFixed(2)} ${p.x.toFixed(2)} ${p.y.toFixed(2)})`);
      text.textContent = n.name;
      circSvgEl.appendChild(text);
      // labelR now always sits at the exact middle of the band (r0..r1), so
      // this comes out to ~92% of the full band for every label — the
      // maximum room physically possible without risking a clipped edge.
      const available = 2 * Math.min(labelR - r0, r1 - labelR) * 0.92;
      let bbox = text.getBBox();
      if(bbox.width > available && n.name.length > 2){
        let lo = 1, hi = n.name.length - 1, best = n.name.slice(0, 1) + '…';
        while(lo <= hi){
          const mid = Math.ceil((lo + hi) / 2);
          const candidate = n.name.slice(0, mid) + '…';
          text.textContent = candidate;
          if(text.getBBox().width <= available){ best = candidate; lo = mid + 1; }
          else { hi = mid - 1; }
        }
        text.textContent = best;
        bbox = text.getBBox();
      }
      if(bbox.width > available && available < 8){
        text.remove();
        return null;
      }
      // Safety net only: the pre-check in addArc already screens out wedges
      // too thin for even one character, so this should rarely fire. It
      // exists for the rare case where the font that's actually loaded (the
      // page measures with whichever one the browser has ready) turns out
      // taller than expected — better to drop a label outright than show a
      // visibly decapitated letter.
      const tangentialSpace = (a1 - a0) * labelR;
      if(bbox.height > tangentialSpace * 2.2){
        text.remove();
        return null;
      }
      text.setAttribute('clip-path', `url(#${makeClip(r0, r1, a0, a1)})`);
      return text;
    }

    // Several daughters of the same father, rendered the normal way, each
    // get their own thin angular slice of his wedge — with enough sisters,
    // that slice gets too narrow for even one character and the whole name
    // is dropped (not just truncated, gone). Since every daughter in this
    // data is a leaf (_total===1, nothing to draw further out for her
    // anyway), there's no cost to NOT subdividing their father's arc among
    // them individually: instead they all share one undivided wedge, and
    // each of their names gets its own radial row stacked inside it. Every
    // row gets the group's FULL angular width (never divided further) —
    // only the radial slice of the row is divided among the sisters — which
    // is a good trade here because the font-size/tangential-space check is
    // what was actually dropping names outright, while shortening the
    // radial room just costs a little extra ellipsis-truncation on long
    // names, which is far better than no name at all.
    function addDaughterGroup(daughters, r0, r1, a0, a1, ring){
      femaleCount += daughters.length;
      deepestRendered = Math.max(deepestRendered, ring);
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', arcPath(cx, cy, r0, r1, a0, a1));
      const highlighted = daughters.indexOf(circHighlightNode) !== -1;
      path.setAttribute('class', 'circ-arc female' + (highlighted ? ' highlight' : ''));
      // With more than one daughter sharing the wedge there's no single
      // person a click on the background itself should open — each
      // stacked name below is its own click target instead. With exactly
      // one daughter it behaves exactly like any other wedge.
      if(daughters.length === 1){
        path.addEventListener('click', () => centerCircularOn(daughters[0]));
      }
      circSvgEl.appendChild(path);

      const midA = (a0 + a1) / 2;
      const count = daughters.length;
      const rowBand = (r1 - r0) / count;
      const angWidth = a1 - a0;
      daughters.forEach((d, i) => {
        const rr0 = r0 + rowBand * i;
        const rr1 = rr0 + rowBand;
        const rowR = rr0 + rowBand * 0.5;
        if(angWidth * rowR > 3){
          const text = renderRadialLabel(d, rr0, rr1, a0, a1, midA, rowR);
          if(text && count > 1){
            text.classList.add('group-label');
            text.addEventListener('click', () => centerCircularOn(d));
          }
        }
      });
    }

    // Splits a set of siblings into sons (each still gets their own
    // individually-sized wedge, exactly as before) and daughters (grouped
    // into one shared wedge via addDaughterGroup, with a single combined
    // weight standing in for all of them when dividing up the angular
    // total). Used for both the root-level ring and every deeper ring, so
    // the grouping behaves identically no matter how far out it happens.
    function renderChildren(kids, r0, r1, a0, a1, ring){
      const sons = kids.filter(c => c.gender !== 'female');
      const daughters = kids.filter(c => c.gender === 'female');
      const sonWeights = sons.map(c => spanWeight(c));
      const dWeight = daughters.length ? groupWeight(daughters.length) : 0;
      const total = sonWeights.reduce((s, w) => s + w, 0) + dWeight || 1;
      const fullSpan = a1 - a0;
      let a = a0;
      sons.forEach((c, idx) => {
        const span = fullSpan * (sonWeights[idx] / total);
        addArc(c, r0, r1, a, a + span, ring, idx);
        a += span;
      });
      if(daughters.length){
        const span = fullSpan * (dWeight / total);
        addDaughterGroup(daughters, r0, r1, a, a + span, ring);
        a += span;
      }
    }

    function addArc(n, r0, r1, a0, a1, ring, siblingIdx){
      if(n.gender === 'female') femaleCount++; else maleCount++;
      deepestRendered = Math.max(deepestRendered, ring);
      const path = document.createElementNS(svgNS, 'path');
      path.setAttribute('d', arcPath(cx, cy, r0, r1, a0, a1));
      path.setAttribute('class', 'circ-arc ' + (n.gender === 'female' ? 'female' : 'male') + (n === circHighlightNode ? ' highlight' : ''));
      // every wedge opens its own circular tree when pressed, even a leaf
      // with no children (it simply opens with nothing further outward
      // beyond the center circle)
      path.addEventListener('click', () => centerCircularOn(n));
      circSvgEl.appendChild(path);

      // This is just a cheap "is there any point even trying" pre-check —
      // the real, precise decision (does a full character actually fit
      // without being clipped) happens inside renderRadialLabel once the
      // text exists to measure.
      const angWidth = a1 - a0;
      const midA = (a0 + a1) / 2;
      const band = r1 - r0;
      // Every label — male or female — sits at the exact middle of its own
      // wedge's band now. Male names used to be staggered across three
      // radial tiers (0.24/0.5/0.76) to vary the look, but every label
      // already gets its own exclusive clip-path, so two wedges can never
      // bleed into each other regardless of where within the band a label
      // sits — the staggering bought no actual overlap protection. What it
      // DID cost: two of every three male names sat on a tier with only
      // ~24% of the band's room on their nearer side instead of the full
      // 50% a centered label gets, truncating them far more than necessary.
      // Centering every label fixes that directly.
      const labelR = r0 + band * 0.5;
      if(angWidth * labelR > 3){
        renderRadialLabel(n, r0, r1, a0, a1, midA, labelR);
      }

      const kids = visibleChildren(n);
      if(ring < depth && kids.length){
        renderChildren(kids, r1, r1 + ringThickness, a0, a1, ring + 1);
      }
    }

    const rootKids = visibleChildren(node);
    if(rootKids.length){
      renderChildren(rootKids, centerR, centerR + ringThickness, 0, 2 * Math.PI, 1);
    }

    const g = document.createElementNS(svgNS, 'g');
    g.setAttribute('class', 'circ-center');
    const circle = document.createElementNS(svgNS, 'circle');
    circle.setAttribute('class', 'circ-center-circle');
    circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', centerR);
    g.appendChild(circle);
    const nameText = document.createElementNS(svgNS, 'text');
    nameText.setAttribute('class', 'circ-center-name');
    nameText.setAttribute('x', cx); nameText.setAttribute('y', cy - 6);
    nameText.setAttribute('text-anchor', 'middle');
    nameText.textContent = node.name;
    g.appendChild(nameText);
    const genText = document.createElementNS(svgNS, 'text');
    genText.setAttribute('class', 'circ-center-gen');
    genText.setAttribute('x', cx); genText.setAttribute('y', cy + 14);
    genText.setAttribute('text-anchor', 'middle');
    genText.textContent = 'الجيل ' + (node._depth + 1);
    g.appendChild(genText);
    // pressing the center circle itself intentionally does nothing — going
    // back happens only via the "⬅ رجوع" button
    circSvgEl.appendChild(g);

    circCaptionEl.textContent = `${deepestRendered} أجيال ظاهرة   ${maleCount} ذكور   ${femaleCount} إناث`;
  }
  circBackBtn.addEventListener('click', circGoBack);

  function augment(node, depth, parent){
    node._depth = depth;
    node._parent = parent;
    node._children = node.children || [];
    if(depth < 4){
      node._color = lighten(BRANCH_FALLBACK, depth * 0.09);
      node._branchBase = null;
      node._branchName = null;
    } else if(depth === 4){
      node._branchBase = BRANCH_COLORS[node.name] || BRANCH_FALLBACK;
      node._color = lighten(node._branchBase, depth * 0.09);
      node._branchName = node.name;
    } else {
      node._branchBase = parent._branchBase;
      node._branchName = parent._branchName;
      node._color = lighten(node._branchBase, Math.min(depth * 0.09, 0.7));
    }
    node._total = 1;
    node._children.forEach(c => { augment(c, depth+1, node); node._total += c._total; });
  }

  const allNodes = [];

  // ---- locate a node by the path of child-indices from the root (robust even
  // when several people share the same name), used to apply stored additions
  // and corrections at the exact spot they were made ----
  function indexPath(n){
    const path = [];
    let cur = n;
    while(cur._parent){
      path.unshift(cur._parent._children.indexOf(cur));
      cur = cur._parent;
    }
    return path;
  }
  function nodeAtIndexPath(path){
    let node = data;
    for(const idx of path){
      if(!node._children || idx < 0 || idx >= node._children.length) return null;
      node = node._children[idx];
    }
    return node;
  }
  function attachChild(parent, name, gender){
    const raw = { name: name, gender: gender };
    if(!parent.children) parent.children = [];
    parent.children.push(raw);
    parent._children = parent.children;
    augment(raw, parent._depth + 1, parent);
    let cur = parent;
    while(cur){ cur._total += raw._total; cur = cur._parent; }
    return raw;
  }

  // ---- render ----
  const DEFAULT_OPEN_DEPTH = 4;

  function buildRow(node){
    const row = document.createElement('div');
    row.className = 'row' + (node._children.length ? ' has-children' : '');

    const bar = document.createElement('span');
    bar.className = 'branch-bar';
    bar.style.background = node._color;
    bar.style.setProperty('--branch-solid', node._branchBase || '#1f6b45');
    bar.setAttribute('data-initial', (node.name || '').trim().charAt(0) || '');
    row.appendChild(bar);

    if(node._children.length){
      const toggle = document.createElement('span');
      toggle.className = 'toggle' + (node._depth < DEFAULT_OPEN_DEPTH ? ' open' : '');
      toggle.textContent = '◂';
      row.appendChild(toggle);
    } else {
      const spacer = document.createElement('span');
      spacer.className = 'spacer';
      row.appendChild(spacer);
    }

    const name = document.createElement('span');
    name.className = 'name ' + (node.gender === 'female' ? 'female' : 'male');
    name.textContent = node.name;
    row.appendChild(name);

    if(node._children.length){
      const count = document.createElement('span');
      count.className = 'count';
      count.textContent = `(${node._total} فرد)`;
      row.appendChild(count);
    }
    return row;
  }

  function buildNode(node){
    const wrap = document.createElement('div');
    wrap.className = 'node' + (node.gender === 'female' ? ' gender-female' : '');
    node._el = wrap;
    const row = buildRow(node);
    node._row = row;
    wrap.appendChild(row);

    if(node._children.length){
      const childWrap = document.createElement('div');
      childWrap.className = 'children' + (node._depth < DEFAULT_OPEN_DEPTH ? '' : ' collapsed');
      node._childWrap = childWrap;
      node._children.forEach(c => childWrap.appendChild(buildNode(c)));
      wrap.appendChild(childWrap);

      row.addEventListener('click', () => {
        childWrap.classList.toggle('collapsed');
        row.querySelector('.toggle').classList.toggle('open');
      });
    }
    return wrap;
  }

  // Everything below depends on the final tree (after stored additions/
  // corrections have been applied), so it all runs inside boot().
  function boot(){
  allNodes.length = 0;
  (function collect(n){ allNodes.push(n); n._children.forEach(collect); })(data);

  const viewport = document.getElementById('treeViewport');
  viewport.innerHTML = '';
  const frag = document.createDocumentFragment();
  frag.appendChild(buildNode(data));
  viewport.appendChild(frag);

  // ---- the list page's own expand/collapse-all controls (this sidebar is
  // only ever shown on the شجرة الصالح page now — the أقربائي page has its
  // own separate toolbar for stepping generations in/out) ----
  document.getElementById('expandAllBtn').onclick = () => {
    allNodes.forEach(n => {
      if(n._childWrap) n._childWrap.classList.remove('collapsed');
      if(n._row){ const t = n._row.querySelector('.toggle'); if(t) t.classList.add('open'); }
    });
    listHistory = [];
    updateListBackBtn();
  };
  // طي الكل no longer collapses all the way down to just the root — it
  // snaps back to the same default view the page opens with (5 generations
  // visible: DEFAULT_OPEN_DEPTH levels open, everything past that collapsed),
  // so pressing it always returns to one known, useful orientation instead
  // of an empty-looking single root row.
  document.getElementById('collapseAllBtn').onclick = () => {
    allNodes.forEach(n => {
      const shouldBeOpen = n._depth < DEFAULT_OPEN_DEPTH;
      if(n._childWrap) n._childWrap.classList.toggle('collapsed', !shouldBeOpen);
      if(n._row){ const t = n._row.querySelector('.toggle'); if(t) t.classList.toggle('open', shouldBeOpen); }
    });
    listHistory = [];
    updateListBackBtn();
  };
  document.getElementById('hideFemaleChk').addEventListener('change', (e) => {
    document.body.classList.toggle('hide-female', e.target.checked);
    hideFemales = e.target.checked;
    const circChk = document.getElementById('circHideFemaleChk');
    if(circChk) circChk.checked = e.target.checked;
    if(circCenterNode) renderCircular();
  });

  // ---- أقربائي page's own hide-females toggle, independent of the list
  // page's sidebar control ----
  document.getElementById('circHideFemaleChk').addEventListener('change', (e) => {
    document.body.classList.toggle('hide-female', e.target.checked);
    hideFemales = e.target.checked;
    const sideChk = document.getElementById('hideFemaleChk');
    if(sideChk) sideChk.checked = e.target.checked;
    if(circCenterNode) renderCircular();
  });
  document.getElementById('relNewSearchBtn').addEventListener('click', () => {
    resetRelativesForm();
    showRelativesSearchForm();
  });

  // ---- search (Arabic-aware normalization + cascading suggestions) ----
  const ARABIC_ALLOWED = /[^؀-ۿݐ-ݿࢠ-ࣿ\s]/g;
  function arabicOnly(s){ return (s || '').replace(ARABIC_ALLOWED, ''); }
  function normalizeArabic(s){
    return arabicOnly(s)
      .replace(/[ً-ٰٟـ]/g, '')
      .replace(/[إأآا]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(/\s+/g, ' ')
      .trim();
  }
  function fieldTerm(id){
    const raw = document.getElementById(id).value || '';
    const cleaned = arabicOnly(raw).trim().replace(/^(بن|ابن|بنت)\s+/, '');
    return normalizeArabic(cleaned);
  }
  function ancestorChain(n){
    const chain = [];
    let cur = n;
    while(cur){ chain.push(cur.name); cur = cur._parent; }
    return chain;
  }
  function normalizedChain(n){ return ancestorChain(n).map(normalizeArabic); }
  function currentFields(){
    return {
      name: fieldTerm('searchName'),
      father: fieldTerm('searchFather'),
      grandfather: fieldTerm('searchGrandfather'),
      ggf: fieldTerm('searchGGFather'),
      branch: fieldTerm('searchBranch')
    };
  }
  function matchScore(name, term){
    if(name === term) return 0;
    if(name.startsWith(term)) return 1;
    if(name.includes(term)) return 2;
    return null;
  }
  function filterCandidates(fields){
    const { name, father, grandfather, ggf, branch } = fields;
    return allNodes.filter(n => {
      const chain = normalizedChain(n);
      if(name && (!chain[0] || matchScore(chain[0], name) === null)) return false;
      if(father && (!chain[1] || matchScore(chain[1], father) === null)) return false;
      if(grandfather && (!chain[2] || matchScore(chain[2], grandfather) === null)) return false;
      if(ggf && (!chain[3] || matchScore(chain[3], ggf) === null)) return false;
      if(branch){
        const bn = n._branchName ? normalizeArabic(n._branchName) : '';
        if(!bn || matchScore(bn, branch) === null) return false;
      }
      return true;
    });
  }
  function search(fields){
    const { name, father, grandfather, ggf, branch } = fields;
    if(!name && !father && !grandfather && !ggf && !branch) return [];
    let scored = filterCandidates(fields).map(n => {
      const chain = normalizedChain(n);
      let total = 0;
      if(name) total += matchScore(chain[0], name);
      if(father) total += matchScore(chain[1], father);
      if(grandfather) total += matchScore(chain[2], grandfather);
      if(ggf) total += matchScore(chain[3], ggf);
      if(branch) total += matchScore(normalizeArabic(n._branchName), branch);
      return { n, s: total };
    });
    if(!scored.length){
      const terms = [name, father, grandfather, ggf].filter(Boolean);
      scored = allNodes.map(n => {
        const chain = normalizedChain(n);
        const ok = terms.every(t => chain.some(part => part.includes(t)));
        if(!ok) return null;
        if(branch){
          const bn = n._branchName ? normalizeArabic(n._branchName) : '';
          if(!bn.includes(branch)) return null;
        }
        return { n, s: 3 };
      }).filter(Boolean);
    }
    scored.sort((a,b) => a.s - b.s || a.n.name.localeCompare(b.n.name, 'ar'));
    return scored.slice(0, 30).map(x => x.n);
  }
  // ---- tap/click-friendly suggestion dropdowns (works the same on phones
  // and computers — native <datalist> popups are unreliable on mobile
  // browsers, especially iOS Safari, so we build our own) ----
  const fieldOptionsCache = {};
  function setFieldOptions(key, values){
    fieldOptionsCache[key] = [...new Set(values.filter(Boolean))].sort((a,b) => a.localeCompare(b, 'ar'));
  }
  function refreshFatherOptions(){
    const f = currentFields();
    setFieldOptions('father', filterCandidates({ name: f.name }).map(n => ancestorChain(n)[1]));
  }
  function refreshGrandfatherOptions(){
    const f = currentFields();
    setFieldOptions('grandfather', filterCandidates({ name: f.name, father: f.father }).map(n => ancestorChain(n)[2]));
  }
  function refreshGgfOptions(){
    const f = currentFields();
    setFieldOptions('ggf', filterCandidates({ name: f.name, father: f.father, grandfather: f.grandfather }).map(n => ancestorChain(n)[3]));
  }
  function refreshBranchOptions(){
    const f = currentFields();
    setFieldOptions('branch', filterCandidates({ name: f.name, father: f.father, grandfather: f.grandfather, ggf: f.ggf }).map(n => n._branchName));
  }
  setFieldOptions('name', allNodes.map(n => n.name));
  refreshFatherOptions();
  refreshGrandfatherOptions();
  refreshGgfOptions();
  refreshBranchOptions();

  function wireSuggestBox(inputEl, boxEl, key){
    function render(){
      const list = fieldOptionsCache[key] || [];
      const typed = (inputEl.value || '').trim();
      const typedNorm = normalizeArabic(typed);
      const filtered = typedNorm ? list.filter(v => normalizeArabic(v).includes(typedNorm)) : list;
      if(!filtered.length){
        boxEl.innerHTML = '<div class="empty">لا اقتراحات</div>';
        boxEl.classList.add('open');
        return;
      }
      boxEl.innerHTML = filtered.slice(0, 300).map(v => `<div data-v="${v.replace(/"/g,'&quot;')}">${v}</div>`).join('');
      boxEl.classList.add('open');
    }
    inputEl.addEventListener('focus', render);
    inputEl.addEventListener('input', render);
    boxEl.addEventListener('click', (e) => {
      const item = e.target.closest('div[data-v]');
      if(!item) return;
      inputEl.value = item.getAttribute('data-v');
      boxEl.classList.remove('open');
      inputEl.dispatchEvent(new Event('input', { bubbles:true }));
      inputEl.focus();
    });
  }
  wireSuggestBox(document.getElementById('searchName'), document.getElementById('nameSuggestBox'), 'name');
  wireSuggestBox(document.getElementById('searchFather'), document.getElementById('fatherSuggestBox'), 'father');
  wireSuggestBox(document.getElementById('searchGrandfather'), document.getElementById('grandfatherSuggestBox'), 'grandfather');
  wireSuggestBox(document.getElementById('searchGGFather'), document.getElementById('ggfatherSuggestBox'), 'ggf');
  wireSuggestBox(document.getElementById('searchBranch'), document.getElementById('branchSuggestBox'), 'branch');
  document.addEventListener('click', (e) => {
    document.querySelectorAll('.suggest-box.open').forEach(box => {
      const field = box.closest('.search-field');
      if(!field || !field.contains(e.target)) box.classList.remove('open');
    });
  });

  document.getElementById('searchName').addEventListener('input', refreshFatherOptions);
  document.getElementById('searchFather').addEventListener('input', refreshGrandfatherOptions);
  document.getElementById('searchGrandfather').addEventListener('input', refreshGgfOptions);
  document.getElementById('searchGGFather').addEventListener('input', refreshBranchOptions);

  function updateListBackBtn(){
    const btn = document.getElementById('listBackBtn');
    if(btn) btn.disabled = listHistory.length === 0;
  }

  function clearSearchMatch(){
    if(searchMatchRow){ searchMatchRow.classList.remove('search-match'); searchMatchRow = null; }
  }

  // On a phone the tree rows now scroll inside their own pane
  // (#treeViewport, see the mobile "app shell" CSS) instead of the whole
  // page scrolling, so رجوع's scroll-position save/restore has to target
  // whichever one is actually the live scroll container right now --
  // #treeViewport on a phone, the window itself on desktop.
  function getScrollContainer(){
    const el = document.getElementById('treeViewport');
    return (el && getComputedStyle(el).overflowY === 'auto') ? el : null;
  }
  function currentScrollPos(){
    const c = getScrollContainer();
    return c ? c.scrollTop : window.scrollY;
  }
  function restoreScrollPos(pos){
    const c = getScrollContainer();
    (c || window).scrollTo({ top: pos, behavior: 'smooth' });
  }

  function revealNode(n){
    const scrollY = currentScrollPos();
    const openedAncestors = [];
    let cur = n._parent;
    while(cur){
      if(cur._childWrap){
        // only remember ancestors that were ACTUALLY collapsed before this —
        // رجوع should re-collapse exactly what reveal opened, not touch
        // anything the user had already expanded themselves
        if(cur._childWrap.classList.contains('collapsed')){
          openedAncestors.push(cur);
        }
        cur._childWrap.classList.remove('collapsed');
        const t = cur._row && cur._row.querySelector('.toggle');
        if(t) t.classList.add('open');
      }
      cur = cur._parent;
    }
    listHistory.push({ scrollY, openedAncestors, matchedRow: n._row });
    updateListBackBtn();
    n._row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    n._row.classList.add('highlight-flash');
    setTimeout(() => n._row.classList.remove('highlight-flash'), 1800);
    // persistent yellow shadow over the chosen member -- unlike the brief
    // flash above, this stays until a new بحث search starts or رجوع undoes
    // this exact reveal
    clearSearchMatch();
    n._row.classList.add('search-match');
    searchMatchRow = n._row;
  }

  function listGoBack(){
    if(!listHistory.length) return;
    const entry = listHistory.pop();
    entry.openedAncestors.forEach(cur => {
      if(cur._childWrap) cur._childWrap.classList.add('collapsed');
      const t = cur._row && cur._row.querySelector('.toggle');
      if(t) t.classList.remove('open');
    });
    restoreScrollPos(entry.scrollY);
    // every reveal in this history came from a بحث search, so undoing one
    // also clears the yellow shadow it set (but only if it's still the same
    // row -- a later search may have already replaced it)
    if(entry.matchedRow === searchMatchRow) clearSearchMatch();
    updateListBackBtn();
  }
  document.getElementById('listBackBtn').addEventListener('click', listGoBack);

  // ---- شجرة الصالح page's بحث toggle: opens/closes the 5-field panel in
  // place (the user never leaves the list page). Finishing the 5th field
  // (الفرع الرئيسي) with a match that EXACTLY identifies one person auto-
  // closes the panel and jumps straight to them with the persistent yellow
  // shadow above -- no separate submit button needed. ----
  const listSearchPanelWrap = document.getElementById('listSearchPanelWrap');
  const listSearchToggleBtn = document.getElementById('listSearchToggleBtn');
  const searchResultsBox = document.getElementById('searchResults');
  const LIST_SEARCH_FIELD_IDS = ['searchName','searchFather','searchGrandfather','searchGGFather','searchBranch'];

  function resetListSearchPanel(){
    LIST_SEARCH_FIELD_IDS.forEach(id => { document.getElementById(id).value = ''; });
    listSearchPanelWrap.querySelectorAll('.suggest-box.open').forEach(b => b.classList.remove('open'));
    searchResultsBox.innerHTML = '';
    searchResultsBox.style.display = 'none';
  }

  listSearchToggleBtn.addEventListener('click', () => {
    const isClosed = listSearchPanelWrap.classList.contains('collapsed');
    if(isClosed){
      resetListSearchPanel();
      listSearchPanelWrap.classList.remove('collapsed');
      document.getElementById('searchName').focus();
    }else{
      listSearchPanelWrap.classList.add('collapsed');
    }
  });

  // deliberately stricter than search()'s fuzzy/partial matching used
  // elsewhere on this page -- this only fires once the user has actually
  // finished typing each of the 5 full, correct names. A partial prefix
  // (e.g. "صا" of "صالح") would otherwise "match" early via startsWith and
  // jump the tree before they're done typing.
  function exactListMatches(fields){
    const { name, father, grandfather, ggf, branch } = fields;
    if(!name || !father || !grandfather || !ggf || !branch) return [];
    return allNodes.filter(n => {
      const chain = normalizedChain(n);
      if(chain[0] !== name) return false;
      if(chain[1] !== father) return false;
      if(chain[2] !== grandfather) return false;
      if(chain[3] !== ggf) return false;
      const bn = n._branchName ? normalizeArabic(n._branchName) : '';
      return bn === branch;
    });
  }

  function maybeAutoResolveListSearch(){
    const fields = currentFields();
    const allFilled = fields.name && fields.father && fields.grandfather && fields.ggf && fields.branch;
    if(!allFilled){
      searchResultsBox.style.display = 'none';
      return;
    }
    const matches = exactListMatches(fields);
    if(!matches.length){
      searchResultsBox.innerHTML = '<div class="error">لا يوجد فرد بهذه الأسماء الخمسة — تحقق من التدقيق</div>';
      searchResultsBox.style.display = 'block';
      return;
    }
    // exactly one in the normal case; in the rare event of a duplicate
    // 5-name chain, pick the first (sorted, deterministic) match rather
    // than leaving the user stuck with no way to submit
    listSearchPanelWrap.classList.add('collapsed');
    searchResultsBox.style.display = 'none';
    revealNode(matches[0]);
  }
  LIST_SEARCH_FIELD_IDS.forEach(id => {
    document.getElementById(id).addEventListener('input', maybeAutoResolveListSearch);
  });

  // ---- أقربائي page: a separate 5-mandatory-field search that resolves a
  // single person, then opens the circular tree centered on THEIR
  // grandfather (two generations up) — showing that person together with
  // their father, uncles/aunts, and siblings, a tight "relatives" view ----
  function relativesCurrentFields(){
    return {
      name: fieldTerm('relName'),
      father: fieldTerm('relFather'),
      grandfather: fieldTerm('relGrandfather'),
      ggf: fieldTerm('relGGFather'),
      branch: fieldTerm('relBranch')
    };
  }
  function relRefreshFatherOptions(){
    const f = relativesCurrentFields();
    setFieldOptions('relFather', filterCandidates({ name: f.name }).map(n => ancestorChain(n)[1]));
  }
  function relRefreshGrandfatherOptions(){
    const f = relativesCurrentFields();
    setFieldOptions('relGrandfather', filterCandidates({ name: f.name, father: f.father }).map(n => ancestorChain(n)[2]));
  }
  function relRefreshGgfOptions(){
    const f = relativesCurrentFields();
    setFieldOptions('relGgf', filterCandidates({ name: f.name, father: f.father, grandfather: f.grandfather }).map(n => ancestorChain(n)[3]));
  }
  function relRefreshBranchOptions(){
    const f = relativesCurrentFields();
    setFieldOptions('relBranch', filterCandidates({ name: f.name, father: f.father, grandfather: f.grandfather, ggf: f.ggf }).map(n => n._branchName));
  }
  setFieldOptions('relName', allNodes.map(n => n.name));
  relRefreshFatherOptions();
  relRefreshGrandfatherOptions();
  relRefreshGgfOptions();
  relRefreshBranchOptions();

  wireSuggestBox(document.getElementById('relName'), document.getElementById('relNameSuggestBox'), 'relName');
  wireSuggestBox(document.getElementById('relFather'), document.getElementById('relFatherSuggestBox'), 'relFather');
  wireSuggestBox(document.getElementById('relGrandfather'), document.getElementById('relGrandfatherSuggestBox'), 'relGrandfather');
  wireSuggestBox(document.getElementById('relGGFather'), document.getElementById('relGgfatherSuggestBox'), 'relGgf');
  wireSuggestBox(document.getElementById('relBranch'), document.getElementById('relBranchSuggestBox'), 'relBranch');

  document.getElementById('relName').addEventListener('input', relRefreshFatherOptions);
  document.getElementById('relFather').addEventListener('input', relRefreshGrandfatherOptions);
  document.getElementById('relGrandfather').addEventListener('input', relRefreshGgfOptions);
  document.getElementById('relGGFather').addEventListener('input', relRefreshBranchOptions);

  function openRelativesTreeFor(matchNode){
    let target = matchNode;
    if(target._parent) target = target._parent;
    if(target._parent) target = target._parent;
    circHighlightNode = matchNode; // yellow-highlight the exact person searched for
    showRelativesChart();
    centerCircularOn(target, true); // fresh starting point — nothing to رجوع to yet
  }
  const relResultsBox = document.getElementById('relResults');
  function runRelativesSearch(){
    const fields = relativesCurrentFields();
    if(!fields.name || !fields.father || !fields.grandfather || !fields.ggf || !fields.branch){
      relResultsBox.innerHTML = '<div class="error">الأسماء الخمسة جميعها مطلوبة — الاسم، الأب، الجد، الجد الأكبر، والفرع الرئيسي</div>';
      relResultsBox.style.display = 'block';
      return;
    }
    const matches = search(fields);
    if(matches.length === 1){
      relResultsBox.style.display = 'none';
      openRelativesTreeFor(matches[0]);
      return;
    }
    if(!matches.length){
      relResultsBox.innerHTML = '<div class="error">لم يتم العثور على نتيجة مطابقة — تأكد من الأسماء الخمسة</div>';
      relResultsBox.style.display = 'block';
      return;
    }
    relResultsBox.innerHTML = matches.map((n,i) => {
      const path = ancestorChain(n).join(' ← ');
      return `<div data-i="${i}">${n.name}<div class="path">${path}</div></div>`;
    }).join('');
    relResultsBox.style.display = 'block';
    relResultsBox.querySelectorAll('div[data-i]').forEach(elm => {
      elm.addEventListener('click', () => {
        const idx = +elm.getAttribute('data-i');
        relResultsBox.style.display = 'none';
        openRelativesTreeFor(matches[idx]);
      });
    });
  }
  document.getElementById('relSearchBtn').addEventListener('click', runRelativesSearch);
  [
    document.getElementById('relName'),
    document.getElementById('relFather'),
    document.getElementById('relGrandfather'),
    document.getElementById('relGGFather'),
    document.getElementById('relBranch')
  ].forEach(inp => inp.addEventListener('keydown', e => { if(e.key === 'Enter') runRelativesSearch(); }));
  document.addEventListener('click', (e) => {
    if(!e.target.closest('.relatives-search-panel .search-panel-wrap')) relResultsBox.style.display = 'none';
  });

  } // end boot()

  // ---- bootstrap: load the base tree plus any admin-saved additions and
  // corrections, all as plain static JSON files next to this page, then graft
  // additions and apply corrections onto the tree BEFORE the first render ----
  function applyStoredAdditions(list){
    (list || []).forEach(item => {
      if(!item || !Array.isArray(item.path) || !item.name) return;
      if(item.gender !== 'male' && item.gender !== 'female') return;
      const parent = nodeAtIndexPath(item.path);
      if(parent) attachChild(parent, item.name, item.gender);
    });
  }
  function applyStoredCorrections(list){
    (list || []).forEach(item => {
      if(!item || !Array.isArray(item.path) || !item.name) return;
      if(item.gender !== 'male' && item.gender !== 'female') return;
      const node = nodeAtIndexPath(item.path);
      if(node){ node.name = item.name; node.gender = item.gender; }
    });
  }
  function loadJSON(path){
    return fetch(path, { cache: 'no-store' }).then(res => {
      if(!res.ok) throw new Error(path + ': ' + res.status);
      return res.json();
    });
  }
  Promise.all([
    loadJSON('data/tree.json'),
    loadJSON('data/additions.json').catch(() => []),
    loadJSON('data/corrections.json').catch(() => [])
  ]).then(([treeData, additions, corrections]) => {
    data = treeData;
    augment(data, 0, null);
    applyStoredAdditions(additions);
    applyStoredCorrections(corrections);
    boot();
  }).catch(err => {
    console.error('failed to load tree data:', err);
    document.getElementById('loadNote').textContent = 'تعذر تحميل بيانات الشجرة. تأكد أن data/tree.json موجود بجانب هذه الصفحة.';
  });
</script>
<script>
  // PWA: lets the site be added to a phone's home screen and keep working
  // on a weak/offline connection. Safe to no-op anywhere this isn't
  // supported (older browsers, or a non-HTTPS preview) -- the site works
  // exactly the same either way, this just adds the offline/installable
  // layer on top where the browser allows it.
  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>
</body>
</html>
